<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in — CRM Admin</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <h1>Sign in</h1>
      <p class="lede">Lead pipeline and site admin.</p>

      <div class="login-error hidden" id="error" role="alert"></div>

      <form id="login-form" novalidate>
        <label class="field">
          <span>Workspace</span>
          <input type="text" name="tenant" id="tenant" autocomplete="organization"
                 placeholder="demo" spellcheck="false">
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" name="email" id="email" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" name="password" id="password" autocomplete="current-password" required>
        </label>
        <button class="btn btn-primary" type="submit" id="submit">Sign in</button>
      </form>

      <p class="lede" style="margin-top:16px">
        New here? <a href="/register">Create a workspace</a>
        &nbsp;·&nbsp; <a href="/forgot">Forgot password?</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
